<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stacking Rows 레퍼런스</title>
<!-- 원본: Suisse BP Intl(상용) + Sometype. 대체: Pretendard + Sometype Mono -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sometype+Mono:wght@400;500&display=swap" />
<style>
  :root {
    /* ── 컬러 (원본 값 그대로) ── */
    --off-white: #f9f4eb;   /* 배경 */
    --off-black: #010101;   /* 본문, 굵은 선 */
    --dark:      #1a1c1c;   /* GET IN TOUCH 버튼 */
    --line:      rgba(1, 1, 1, 0.14); /* 옅은 구분선 */
    --chip:      #ffffff;   /* 헤더 알약, 칩 */
    --accent:    #e75d60;   /* 원본 팔레트의 red. 열차 컨셉이면 클로드 코랄로 교체 */

    /* ── 타이포 ── */
    --font-sans: "Pretendard", "SuisseBPIntl", Helvetica, Arial, sans-serif;
    --font-mono: "Sometype Mono", "Sometype", ui-monospace, monospace;

    /* ── 그리드 (원본 변수) ── */
    --margin: 2.5rem;       /* 좌우 여백 40px */
    --gutter: 0.625rem;

    /* ── 스택 ── */
    --header-h: 80px;       /* 스택이 멈추는 기준선 */
    --peek: 60px;           /* 쌓인 행이 보이는 높이 */
    --row-h: 360px;

    /* ── 모션 ── */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-io:  cubic-bezier(0.65, 0, 0.35, 1);
  }
  @media (max-width: 1023px) {
    :root { --margin: 1rem; --peek: 44px; --row-h: 375px; --header-h: 72px; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--off-white); }
  body {
    background: var(--off-white);
    color: var(--off-black);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 모노 라벨: 10px, 대문자, 자간 -0.2px */
  .mono {
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 18px;
    font-weight: 500;
    letter-spacing: -0.2px;
    text-transform: uppercase;
  }

  /* ───────── 고정 UI ───────── */
  .header {
    position: fixed; top: 16px; left: 50%; translate: -50% 0;
    width: min(440px, calc(100vw - 2 * var(--margin) - 190px));
    height: 44px; padding: 0 14px;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--chip); border-radius: 2px; z-index: 50;
  }
  .logo { width: 22px; height: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
  .logo i { background: var(--off-black); }
  .logo i:nth-child(2), .logo i:nth-child(5), .logo i:nth-child(6), .logo i:nth-child(9) { background: transparent; }
  /* 태그라인: 섹션이 바뀌면 글자가 위로 넘어간다 */
  .tagline { height: 18px; overflow: hidden; position: relative; flex: 1; text-align: center; }
  .tagline span { display: block; transition: transform .6s var(--ease-io), opacity .6s; }
  .tagline span.out { transform: translateY(-100%); opacity: 0; }
  .tagline span.in-start { transform: translateY(100%); opacity: 0; }
  .burger { width: 16px; display: grid; gap: 3px; }
  .burger i { height: 2px; background: var(--off-black); }

  .cta { position: fixed; top: 16px; right: var(--margin); z-index: 50; display: grid; gap: 6px; width: 160px; }
  .cta-main {
    display: flex; align-items: center; gap: 10px; height: 44px; padding: 5px;
    background: var(--dark); color: var(--off-white); border-radius: 2px; text-decoration: none;
  }
  .avatar { width: 34px; height: 34px; background: linear-gradient(135deg, #6b6b6b, #2a2a2a); border-radius: 1px; }
  .cta-sub {
    display: flex; justify-content: space-between; align-items: center;
    height: 30px; padding: 0 10px; background: var(--chip); border-radius: 2px;
  }
  .lang { position: fixed; right: var(--margin); bottom: 16px; z-index: 50; display: flex; gap: 14px; }
  .lang span:first-child { opacity: .35; }

  /* 커서를 따라다니는 라벨 */
  .cursor-chip {
    position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
    padding: 2px 6px; background: var(--chip); border-radius: 1px;
    translate: 8px -22px; opacity: 0; transition: opacity .25s;
  }
  .cursor-chip.show { opacity: 1; }

  /* ───────── 인트로 ───────── */
  .intro { padding: 180px var(--margin) 120px; }
  .intro p {
    max-width: 560px; font-size: clamp(18px, 1.6vw, 24px); line-height: 1.3; letter-spacing: -0.01em;
  }

  /* ───────── 스태킹 행 (핵심) ───────── */
  .stack { position: relative; padding: 0 var(--margin); }
  .row {
    /* 행마다 멈추는 위치를 peek 만큼씩 아래로 → 계단처럼 쌓인다 */
    position: sticky;
    top: calc(var(--header-h) + var(--i) * var(--peek));
    height: var(--row-h);
    background: var(--off-white); /* 앞 행을 덮어야 하므로 반드시 불투명 */
    display: grid;
    grid-template-columns: 2fr 5fr 5fr;   /* 12컬럼 기준 2 / 5 / 5 */
    column-gap: var(--gutter);
    padding: 30px 0 60px;
  }
  /* 구분선: 옅은 기본선 위에 진한 선이 왼쪽부터 자란다 (스크롤 진행도) */
  .row::before, .row::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
  }
  .row::before { background: var(--line); }
  .row::after {
    background: var(--off-black);
    transform-origin: left center;
    transform: scaleX(var(--progress, 0));
  }

  .num, .title {
    font-weight: 700; text-transform: uppercase;
    font-size: clamp(40px, 4.2vw, 70px); line-height: .8; letter-spacing: -0.02em;
  }
  .title { font-size: clamp(34px, 4.17vw, 60px); }
  .mid { display: flex; flex-direction: column; justify-content: space-between; }
  .items { display: grid; gap: 14px; }
  .list { font-size: clamp(16px, 1.25vw, 18px); line-height: 1.2; letter-spacing: -0.02em; }
  .desc {
    justify-self: end; max-width: 330px;
    font-size: clamp(15px, 1.25vw, 18px); line-height: 1.2; letter-spacing: -0.02em;
  }

  /* 텍스트 리빌: 마스크 안에서 줄이 아래 → 위로 */
  .reveal { overflow: hidden; display: block; }
  .reveal > span {
    display: block; transform: translateY(105%);
    transition: transform .9s var(--ease-out);
    transition-delay: calc(var(--d, 0) * 70ms);
  }
  .is-in .reveal > span { transform: none; }

  @media (max-width: 1023px) {
    .row { grid-template-columns: auto 1fr; grid-template-rows: auto 1fr auto; row-gap: 16px; padding: 22px 0 32px; }
    .num { grid-row: 1; }
    .title { grid-column: 2; }
    .mid { grid-column: 1 / -1; grid-row: 3; }
    .desc { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  }

  /* ───────── ASCII → 사진 리빌 ───────── */
  .media { display: grid; grid-template-columns: 1fr 1fr; padding: 200px var(--margin) 240px; }
  .media-box { grid-column: 2; position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: #d9d4cb; }
  .media-box canvas, .media-box .photo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .photo {
    background:
      radial-gradient(60% 50% at 70% 25%, #fbfaf6 0%, transparent 70%),
      linear-gradient(100deg, #2b2e2b 0%, #3e433f 22%, #c9ccc4 40%, #e8e8e2 70%, #b9b5a9 100%);
    opacity: 0; transition: opacity 1.2s var(--ease-io) .5s;
  }
  .media-box.is-in .photo { opacity: 1; }
  .media-box canvas { transition: opacity .8s var(--ease-io) 1.1s; }
  .media-box.is-in canvas { opacity: 0; }

  @media (max-width: 1023px) {
    .media { grid-template-columns: 1fr; }
    .media-box { grid-column: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal > span { transform: none; transition: none; }
    .row::after { transform: scaleX(1); }
    .photo { opacity: 1; transition: none; }
    .media-box canvas { display: none; }
    .tagline span { transition: none; }
  }
</style>
</head>
<body>

  <!-- 고정 UI -->
  <header class="header">
    <div class="logo" aria-label="로고"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="tagline mono"><span id="tagline">어서 타. 배우고. 만든다.</span></div>
    <div class="burger" aria-label="메뉴"><i></i><i></i><i></i></div>
  </header>

  <nav class="cta">
    <a class="cta-main mono" href="#"><span class="avatar"></span>Get in touch</a>
    <div class="cta-sub mono"><span>Next page</span><span>( + )</span></div>
  </nav>
  <div class="lang mono"><span>KO</span><span>EN</span></div>
  <div class="cursor-chip mono" id="cursorChip"></div>

  <!-- 인트로 -->
  <section class="intro" data-tagline="어서 타. 배우고. 만든다.">
    <p class="js-reveal"><span class="reveal"><span>만들어보고 싶은 서비스 네 가지.</span></span><span class="reveal"><span style="--d:1">과정이 끝나면 하나씩 실제로 배포한다.</span></span></p>
  </section>

  <!-- 스태킹 행: 데이터는 아래 JS 배열에서 생성 -->
  <section class="stack" id="stack" data-tagline="아이디어에서 배포까지"></section>

  <!-- ASCII → 사진 -->
  <section class="media" data-tagline="종착역: 포트폴리오">
    <div class="media-box" id="mediaBox">
      <div class="photo"></div>
      <canvas id="ascii"></canvas>
    </div>
  </section>

<script type="module">
  // ── 콘텐츠 (PRD 4~7페이지) ──
  const ROWS = [
    { title: "의류 쇼핑몰", kicker: "[ 내 아이덴티티를 입히다 ]", chip: "FROM IDEA TO IDENTITY",
      items: ["브랜드 기획", "상품·주문", "결제 보안"],
      desc: "내 취향과 이야기를 입힌 옷을 파는 곳. 소량이라도 내가 만든 걸 내가 판다." },
    { title: "전투력 측정기", kicker: "[ 스카우터를 갖다 대면 ]", chip: "SCAN → 5,300",
      items: ["대상 입력", "AI 전투력 산출", "결과 카드 공유"],
      desc: "무엇이든 전투력으로 환산해 주는 재미용 앱. 무엇을 잴지는 정하는 중." },
    { title: "돼이타베이스", kicker: "[ 내 것들을 한곳에 ]", chip: "🐷 + 🗄️",
      items: ["추가·검색·태그", "표와 카드 보기", "AI에게 물어보기"],
      desc: "흩어진 기록, 취향, 물건 목록을 넣고 꺼내 쓰는 나만의 데이터베이스." },
    { title: "포트폴리오", kicker: "[ 모든 게 모이는 곳 ]", chip: "1 / 4 채워짐",
      items: ["프로젝트 카드", "상세 창", "서비스 링크"],
      desc: "앞의 세 개가 진짜로 만들어지면 들어갈 자리. 이 페이지가 1번이다." },
  ];

  const stack = document.getElementById("stack");
  const lines = t => `<span class="reveal"><span>${t}</span></span>`;
  stack.innerHTML = ROWS.map((r, i) => `
    <article class="row js-reveal" style="--i:${i}" data-chip="${r.chip}">
      <div class="num">${lines(String(i + 1).padStart(2, "0"))}</div>
      <div class="mid">
        <h2 class="title">${lines(r.title)}</h2>
        <div class="items">
          <div class="mono">${lines(r.kicker)}</div>
          <ul class="list" style="list-style:none">
            ${r.items.map((t, j) => `<li class="reveal"><span style="--d:${j + 1}">${t}</span></li>`).join("")}
          </ul>
        </div>
      </div>
      <p class="desc">${lines(r.desc)}</p>
    </article>`).join("");

  // ── 1. 진입 리빌 ──
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
  }), { threshold: 0.25 });
  document.querySelectorAll(".js-reveal, #mediaBox").forEach(el => io.observe(el));

  // ── 2. 구분선 진행도: 행이 화면 아래에서 들어와 자기 sticky 위치에 닿을 때까지 0 → 1 ──
  const rows = [...document.querySelectorAll(".row")];
  const css = getComputedStyle(document.documentElement);
  function updateLines() {
    const vh = innerHeight;
    const headerH = parseFloat(css.getPropertyValue("--header-h"));
    const peek = parseFloat(css.getPropertyValue("--peek"));
    rows.forEach((row, i) => {
      const stickTop = headerH + i * peek;
      const top = row.getBoundingClientRect().top;
      const p = Math.min(1, Math.max(0, (vh - top) / (vh - stickTop)));
      row.style.setProperty("--progress", p.toFixed(3));
    });
  }

  // ── 3. 헤더 태그라인 교체 ──
  const tag = document.getElementById("tagline");
  let current = tag.textContent;
  function swapTagline(text) {
    if (text === current) return;
    current = text;
    tag.classList.add("out");
    setTimeout(() => {
      tag.textContent = text;
      tag.classList.remove("out");
      tag.classList.add("in-start");
      requestAnimationFrame(() => requestAnimationFrame(() => tag.classList.remove("in-start")));
    }, 300);
  }
  const sections = [...document.querySelectorAll("[data-tagline]")];
  function updateTagline() {
    const mid = innerHeight * 0.4;
    const active = sections.filter(s => s.getBoundingClientRect().top < mid).pop() || sections[0];
    swapTagline(active.dataset.tagline);
  }

  // ── 스크롤 루프 (Lenis가 있으면 그 이벤트로, 없으면 네이티브) ──
  let ticking = false;
  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { updateLines(); updateTagline(); ticking = false; });
  };
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll);
  onScroll();

  // ── 4. 커서 라벨 ──
  const chip = document.getElementById("cursorChip");
  let cx = 0, cy = 0, tx = 0, ty = 0;
  addEventListener("pointermove", e => {
    tx = e.clientX; ty = e.clientY;
    const row = e.target.closest?.(".row");
    chip.classList.toggle("show", !!row);
    if (row) chip.textContent = row.dataset.chip;
  });
  (function follow() {
    cx += (tx - cx) * 0.18; cy += (ty - cy) * 0.18;   // 살짝 늦게 따라온다
    chip.style.transform = `translate(${cx}px, ${cy}px)`;
    requestAnimationFrame(follow);
  })();

  // ── 5. ASCII 디더 → 사진 ──
  const cvs = document.getElementById("ascii");
  const box = document.getElementById("mediaBox");
  function drawAscii() {
    const dpr = devicePixelRatio || 1;
    const w = box.clientWidth, h = box.clientHeight;
    cvs.width = w * dpr; cvs.height = h * dpr;
    const ctx = cvs.getContext("2d");
    ctx.scale(dpr, dpr);
    const cell = 7, cols = Math.ceil(w / cell), rowsN = Math.ceil(h / cell);
    // 사진 대신 같은 구도의 명암 맵을 절차적으로 만든다 (실사진을 쓰면 drawImage로 교체)
    const src = document.createElement("canvas");
    src.width = cols; src.height = rowsN;
    const s = src.getContext("2d");
    const g = s.createLinearGradient(0, 0, cols, 0);
    g.addColorStop(0, "#2b2e2b"); g.addColorStop(.22, "#3e433f"); g.addColorStop(.4, "#c9ccc4");
    g.addColorStop(.7, "#e8e8e2"); g.addColorStop(1, "#b9b5a9");
    s.fillStyle = g; s.fillRect(0, 0, cols, rowsN);
    const r = s.createRadialGradient(cols * .7, rowsN * .25, 0, cols * .7, rowsN * .25, cols * .5);
    r.addColorStop(0, "rgba(251,250,246,1)"); r.addColorStop(1, "rgba(251,250,246,0)");
    s.fillStyle = r; s.fillRect(0, 0, cols, rowsN);
    const data = s.getImageData(0, 0, cols, rowsN).data;
    const ramp = "@%#*+=-:. ";
    ctx.fillStyle = "#f9f4eb"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#010101";
    ctx.font = `${cell + 1}px "Sometype Mono", monospace`;
    ctx.textBaseline = "top";
    for (let y = 0; y < rowsN; y++) for (let x = 0; x < cols; x++) {
      const k = (y * cols + x) * 4;
      const lum = (data[k] * .299 + data[k + 1] * .587 + data[k + 2] * .114) / 255;
      ctx.fillText(ramp[Math.min(ramp.length - 1, Math.floor(lum * ramp.length))], x * cell, y * cell);
    }
  }
  document.fonts.ready.then(drawAscii);
  addEventListener("resize", drawAscii);

  // ── (선택) Lenis 부드러운 스크롤: 원본 사이트가 사용 ──
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    try {
      const { default: Lenis } = await import("https://cdn.jsdelivr.net/npm/lenis@1.1.13/+esm");
      const lenis = new Lenis({ lerp: 0.1 });
      lenis.on("scroll", onScroll);
      (function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })();
    } catch { /* 네이티브 스크롤로 동작 */ }
  }
</script>
</body>
</html>
